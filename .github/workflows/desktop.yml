name: App desktop (Windows)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Certificado de teste no repositório do Windows
        shell: pwsh
        run: |
          New-SelfSignedCertificate -Subject 'CN=PDF Studio Teste CI' -CertStoreLocation Cert:\CurrentUser\My `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddDays(2) | Format-List Subject, Thumbprint

      - name: Teste da assinatura com certificado do Windows (caminho dos tokens A3)
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/wincert.test.ts > vitest.log 2>&1
          code=$?
          cat vitest.log
          if [ $code -ne 0 ]; then
            # Mostra o fim da saída como anotação (visível mesmo sem acesso ao log completo).
            msg=$(tail -n 60 vitest.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Teste Windows::$msg"
          fi
          exit $code

      - run: npm run build

      - name: Gerar instalador e versão portátil
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set +e
          npx electron-builder --win --publish never > builder.log 2>&1
          code=$?
          cat builder.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 40 builder.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=electron-builder::$msg"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: release/*.exe

      - name: Publicar para download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: PDF Studio para Windows (build ${{ github.run_number }})
          make_latest: true
          files: release/*.exe
          body: |
            **Instalador:** `PDF-Studio-…-instalador.exe` (instala e cria atalho).
            **Portátil:** `PDF-Studio-…-portatil.exe` (roda sem instalar).

            O Windows pode mostrar "O Windows protegeu o computador" porque o programa não tem
            assinatura de código paga: clique em "Mais informações" › "Executar assim mesmo".

            Gerado a partir do commit ${{ github.sha }}.
